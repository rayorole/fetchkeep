name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command or MCP call and the JSON envelope you received (redact private URLs).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fetchkeep version and backend
      placeholder: "0.1.0, http / chromium / lightpanda"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: "Ubuntu 24.04, Node 24.x"
    validations:
      required: true
