<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Archive recovery notes</title></head><body><main><h1>Archive recovery notes</h1><p>The operator reads <code>archive.lock</code> before opening the <strong>recovery journal</strong>.</p><p>A successful restore preserves the original timestamp and the owner’s signature.</p><p>Never replace a verified snapshot with an incomplete copy.</p></main></body></html>
